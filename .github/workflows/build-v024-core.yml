name: Leo Design Core Bridge v0.20.4
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  edition:
    if: github.event_name != 'pull_request' || github.head_ref == 'leo-v024-native-snapping'
    uses: ./.github/workflows/build-v024-edition.yml
    with:
      flavor: core
      label: Leo Design Core Bridge v0.20.4
      artifact: Leo_Design_Core_Bridge_v0.20.4_Windows_x64_Build
      installer: v024/Leo_Design_Core_Bridge_0_20_4.iss
      output: Leo_Design_Core_Bridge_v0.20.4_Installer
