name: Leo Design Core Bridge v0.16.1
on:
  workflow_dispatch:
  push:
    branches:
      - leo-v022-snapping
    paths:
      - ".github/workflows/build-v022-core.yml"
      - ".github/workflows/build-v022-edition.yml"
      - "v022/leo_snapping_engine.rs"
      - "v022/rotation_*.rs"
      - "v022/text_glyph_*.rs"
      - "v022/text_mode_*.rs"
      - "v022/whole_selection_regressions.rs"
      - "v022/*regressions.rs"
      - "v022/patch_*.py"
      - "v022/ai_export/**"
      - "v022/ai_bridge/**"
      - "v022/overlay/**"
      - "v022/session_regressions.rs"
      - "v022/selected_segments_clipboard_tests.rs"
      - "v021/**"
      - "prepare_v022.py"
      - "scripts/**"

permissions:
  contents: read
jobs:
  edition:
    uses: ./.github/workflows/build-v022-edition.yml
    with:
      flavor: core
      label: Leo Design Core Bridge v0.16.1
      artifact: Leo_Design_Core_Bridge_v0.16.1_Windows_x64
      installer: v022/overlay/Leo_Design_Core_Bridge_0_16_1.iss
      output: Leo_Design_Core_Bridge_v0.16.1_Installer
