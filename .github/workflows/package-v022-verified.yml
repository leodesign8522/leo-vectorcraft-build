name: Package verified Core Bridge v0.14.0
on:
  workflow_dispatch:
  push:
    branches:
      - leo-v022-snapping
    paths:
      - ".github/workflows/package-v022-verified.yml"

permissions:
  contents: read
  actions: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify the completed source build and regression job
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept="application/vnd.github+json"}
          $run = Invoke-RestMethod -Headers $headers -Uri "$api/actions/runs/42346832709"
          if ($run.head_sha -ne "f96207bf7203f5b3d9054a581402054c83cf1587") { throw "Unexpected build source" }
          $jobs = Invoke-RestMethod -Headers $headers -Uri "$api/actions/runs/42346832709/jobs?per_page=100"
          # The original installer job failed only because GUI stdout capture omitted VERSION.txt.
          # Reuse exactly the EXE whose build job passed every configured regression.
          $passed = @($jobs.jobs | Where-Object { $_.name -eq "edition / core (VectorCraft v0.22)" -and $_.conclusion -eq "success" })
          if ($passed.Count -ne 1) { throw "Source build and regression job did not pass" }
      - uses: actions/download-artifact@v4
        with:
          name: Leo_Design_Core_Bridge_v0.14.0_Windows_x64
          run-id: 42346832709
          github-token: ${{ github.token }}
          path: overlay-source
      - name: Verify payload hash, source and executable identity
        shell: pwsh
        run: |
          $source = (Resolve-Path overlay-source/vectorcraft.exe).Path
          $hash = (Get-FileHash $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "300639ffecb3b49c90364b9525f6dfe5260f20ec8904c20a45715d8a506b1983") { throw "EXE differs from tested payload" }
          if ((Get-Content overlay-source/BUILD_COMMIT.txt -Raw).Trim() -ne "f96207bf7203f5b3d9054a581402054c83cf1587") { throw "Build commit mismatch" }
          if ((Get-Content overlay-source/UPSTREAM_COMMIT.txt -Raw).Trim() -ne "654749c16eb20b6d3182a96defb66e11d1a9649a") { throw "Upstream commit mismatch" }
          $versionFile = Join-Path (Split-Path $source) "VERSION.txt"
          $process = Start-Process -FilePath $source -ArgumentList "--version" -RedirectStandardOutput $versionFile -Wait -PassThru -WindowStyle Hidden
          $version = [string](Get-Content $versionFile -Raw)
          if ($process.ExitCode -ne 0 -or $version -notmatch "Core Bridge 0.14.0; Snapping Engine 1.3") { throw "EXE identity mismatch" }
      - name: Compile isolated installer
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          $source = (Resolve-Path overlay-source/vectorcraft.exe).Path
          $outDir = (New-Item -ItemType Directory -Path package-output -Force).FullName
          & $compiler "/DSourceExe=$source" "/O$outDir" "v022/overlay/Leo_Design_Core_Bridge.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
      - name: Install and verify the identical payload
        shell: pwsh
        run: |
          $installer = (Get-ChildItem package-output -Filter *.exe | Select-Object -First 1).FullName
          if (-not $installer) { throw "Missing installer" }
          $installDir = Join-Path $env:RUNNER_TEMP "Leo-Bridge-022-Verified"
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`"" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer smoke test failed" }
          $installed = Join-Path $installDir "vectorcraft.exe"
          $payloadHash = (Get-FileHash $installed -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne "300639ffecb3b49c90364b9525f6dfe5260f20ec8904c20a45715d8a506b1983") { throw "Installed payload mismatch" }
          foreach ($required in @("portable.txt", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "VERSION.txt")) {
            if (-not (Test-Path (Join-Path $installDir $required))) { throw "Installer omitted $required" }
          }
          $versionFile = Join-Path $installDir "installed-version.txt"
          $process = Start-Process -FilePath $installed -ArgumentList "--version" -RedirectStandardOutput $versionFile -Wait -PassThru -WindowStyle Hidden
          $version = [string](Get-Content $versionFile -Raw)
          if ($process.ExitCode -ne 0 -or $version -notmatch "Core Bridge 0.14.0; Snapping Engine 1.3") { throw "Installed identity mismatch" }
          $installerHash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$installerHash  $(Split-Path $installer -Leaf)" | Set-Content package-output/SHA256.txt -Encoding ascii
          Copy-Item overlay-source/BUILD_COMMIT.txt, overlay-source/UPSTREAM_COMMIT.txt package-output/
          [ordered]@{
            bridge="0.14.0"; upstream="0.22.0";
            verified_source_commit="f96207bf7203f5b3d9054a581402054c83cf1587";
            upstream_commit="654749c16eb20b6d3182a96defb66e11d1a9649a";
            build_run=42346832709;
            payload_sha256=$payloadHash; installer_sha256=$installerHash;
            packaging_commit="${{ github.sha }}";
            installed_payload_identical=$true; installed_version=$version.Trim()
          } | ConvertTo-Json | Set-Content package-output/VERIFICATION.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: Leo_Design_Core_Bridge_v0.14.0_Installer
          path: package-output/
          if-no-files-found: error
          retention-days: 30
