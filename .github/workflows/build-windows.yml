name: Leo Design VectorCraft Enhanced - Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# Do not burn build minutes on an old commit when several quick UI fixes land.
concurrency:
  group: leo-vectorcraft-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build independent Windows portable EXE
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Leo Design build recipe
        uses: actions/checkout@v4

      - name: Checkout official VectorCraft v0.17.0
        uses: actions/checkout@v4
        with:
          repository: storytold/vectorcraft
          ref: v0.17.0
          path: vectorcraft
          persist-credentials: false

      - name: Prepare Python for patching (cloud only)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Leo Design Smart Select, Smart Guides, Colour, Export, Workspace, and Text Exit
        shell: pwsh
        run: |
          python scripts/patch_smart_select.py vectorcraft/crates/engine/src/tooling.rs
          if ($LASTEXITCODE -ne 0) { throw "Smart Select patch failed" }
          python scripts/patch_color_preferences.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Colour Settings persistence patch failed" }
          python scripts/patch_image_pro_export.py vectorcraft scripts/leo_image_export.rs
          if ($LASTEXITCODE -ne 0) { throw "Image Pro Export native module patch failed" }
          python scripts/patch_image_export_sidebar.py vectorcraft scripts/leo_image_sidebar.rs
          if ($LASTEXITCODE -ne 0) { throw "Image Pro Export sidebar patch failed" }
          python scripts/patch_workspace_pro.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Workspace Pro docking patch failed" }
          python scripts/patch_text_finish.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Ctrl+Enter Text Finish patch failed" }
          git -C vectorcraft diff --check
          if ($LASTEXITCODE -ne 0) { throw "Patch whitespace check failed" }
          git -C vectorcraft diff --stat

      - name: Install stable Rust on GitHub Windows runner
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Rust install failed" }
          rustup default stable
          rustc --version
          cargo --version

      # Cache the Rust registry and compiled release dependencies between commits.
      # With a stable upstream tag, small Leo Design changes can reuse prior artifacts.
      - name: Restore Rust release build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "vectorcraft -> target"
          shared-key: "leo-vectorcraft-v017-windows-release"
          cache-all-crates: false

      - name: Compile native VectorCraft Windows executable
        shell: pwsh
        working-directory: vectorcraft
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
        run: |
          cargo build --release --locked -p vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Windows compilation failed; inspect build logs" }

      # Detailed UI unit tests are available in the separate manual workflow.
      # Do not rebuild the whole UI test harness after an already-successful EXE.
      - name: Package isolated portable version
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $source = "vectorcraft/target/release/vectorcraft.exe"
          if (-not (Test-Path $source)) { throw "Missing compiled VectorCraft.exe" }
          Copy-Item $source "dist/vectorcraft.exe"
          New-Item -ItemType File -Path "dist/portable.txt" -Force | Out-Null
          @'
          Leo Design VectorCraft Enhanced v0.5.1 (Windows x64)
          
          1. Extract all files into a NEW folder.
          2. Double-click vectorcraft.exe. Your official VectorCraft is not replaced.
          3. Press V (Selection / black arrow).
          4. Ctrl + left-click a child inside a group to select it without ungrouping.
          5. Ctrl + left-drag a child to move it.
          6. To move a whole group by a child anchor without reshaping: select the group with V, press A, then Ctrl+left-drag a visible anchor inside the group. The dragged anchor snaps to other path anchors/endpoints; the whole selected group translates rigidly. Plain dragging still edits anchors; Ctrl+Alt keeps its original behavior.
          7. Plain left-click still selects the whole group.
          8. Ctrl + Alt + left-click retains the original Select Behind behaviour.
          9. Open Edit > Preferences > Smart Guides to customize each guide colour.
          10. Choose Classic Magenta, High Contrast or Cool Studio, then fine-tune individual colours.
          11. Click OK to save; settings persist for this portable build.
          12. Edit > Color Settings > CMYK: choose your ICC profile once, e.g. Japan Color 2001 Coated.
              The chosen working RGB/CMYK profiles, intent and BPC save immediately to
              VectorCraftData/Leo Color Settings.json, and restore automatically on next launch.
          13. Installed ICC files stay in VectorCraftData/Color Profiles. When upgrading,
              keep/copy the OLD VectorCraftData directory next to the NEW EXE so profiles
              and preferences survive; do not delete that directory.
          14. File > Export > Leo Design Image Pro Export opens a dockable Chinese right-sidebar
              panel (not a blocking popup). You can also open it from Window >
              Leo Design Image Pro Export or the right-side picture icon.
              Configure JPEG / transparent PNG, DPI, ICC, quality,
              compression, anti-aliasing, artboards, naming and output folder.
              Supports current / all / range of artboards, including precise DPI.
              v1.0 preview: ICO and separate live image preview are not yet included.
          15. Leo Design Workspace Pro: right-click a panel tab or use its menu (hamburger),
              choose Leo Design Free Layout, then select a destination panel.
              Combine as tabs or split into a new left/right/top/bottom section.
              Keep using the native float command and drag-and-drop as before.
              The right shared dock can grow to 1200 UI points with smaller pane
              minimums, suitable for multiple columns on large monitors.
              Window > Workspace > New Workspace saves the custom layout.
          16. While editing text inside a text frame, Ctrl+Enter (Windows)
              finishes text editing, preserving the text and selecting its object.
              Plain Enter still inserts a line break. IME composition, dialogs
              and user-defined Ctrl+Enter command bindings are not overridden.
          
          portable.txt keeps this build's preferences beside this EXE in VectorCraftData.
          This is an unsigned experimental build: test on copies of design files.
          Built automatically from upstream VectorCraft v0.17.0 plus Leo Design selection, Smart Guides, Group Anchor Move, persistent colour settings, dockable Image Pro Export, Workspace Pro and Ctrl+Enter text finish.
          '@ | Set-Content "dist/README_FIRST.txt" -Encoding utf8
          git -C vectorcraft rev-parse HEAD | Set-Content "dist/UPSTREAM_COMMIT.txt"
          & "dist/vectorcraft.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Compiled executable smoke-test failed" }

      - name: Upload ready-to-unzip Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Leo_Design_VectorCraft_Enhanced_v0.5.1_Windows_x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
