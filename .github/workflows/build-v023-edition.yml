          @'
          Artifact upload requires the release build and every configured regression to pass.
          Core Bridge v0.17.0 fixes alignment to measure enabled glyph bounds, including horizontal/vertical/both centers and key objects.
          Includes Character > ��������ѡ��: tight glyph selection controls without changing editable text, position or wrapping. Click again to restore the metric frame.
          Includes Leo Snapping Engine v2.0: unified node and object movement geometry, finite path/Bezier and artboard edges, bounds alignment, group/multi-object movement, Alt-copy, 8px capture and 12.8px release.
          Native Actions, custom chords, editable AI import, font matching, selected-segment copy,
          native guide clipboard, live corners, image/ICO export, workspace JSON, selection statistics,
          and Leo node/segment/Bezier, artboard, object edge, group, multi-selection, Alt-copy, Shift, zoom and hysteresis tests are checked.
          Custom screenshot clipboard patches and the shortcut backup menu are not integrated.
          Windows GUI/manual acceptance remains pending.
          '@ | Set-Content "dist/BUILD_VALIDATION.txt" -Encoding utf8
          New-Item -ItemType Directory -Path "dist/AI Bridge" -Force | Out-Null
          Copy-Item "v023/ai_bridge/Send_to_VectorCraft.jsx" "dist/AI Bridge/"
          Copy-Item "v023/ai_bridge/README.txt" "dist/AI Bridge/"
          Copy-Item LEO_DESIGN_FEATURE_REGISTRY.md dist/
          git -C vectorcraft rev-parse HEAD | Set-Content "dist/UPSTREAM_COMMIT.txt"
          git rev-parse HEAD | Set-Content "dist/BUILD_COMMIT.txt"
          Get-FileHash "dist/vectorcraft.exe" -Algorithm SHA256 | Format-List | Out-String | Set-Content "dist/SHA256.txt"
          # GUI-subsystem executables need an explicit wait and stdout handle.
          # An empty PowerShell pipeline made -notmatch return an empty array,
          # bypassing the old guard and leaving VERSION.txt absent.
          $versionFile = Join-Path (Resolve-Path dist).Path "VERSION.txt"
          $versionProcess = Start-Process -FilePath (Resolve-Path dist/vectorcraft.exe).Path -ArgumentList "--version" -RedirectStandardOutput $versionFile -Wait -PassThru -WindowStyle Hidden
          $version = [string](Get-Content $versionFile -Raw)
          if ($versionProcess.ExitCode -ne 0 -or $version -notmatch "Core Bridge 0.17.0; Snapping Engine 2.0") { throw "EXE build identity smoke test failed" }
      - name: Upload experimental Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  overlay-installer:
    name: Package ${{ inputs.flavor }} installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: overlay-source
      - name: Compile version-checked installer
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Unable to install Inno Setup" }
          }
          $source = (Resolve-Path "overlay-source/vectorcraft.exe").Path
          $outDir = (New-Item -ItemType Directory -Force -Path "overlay-output").FullName
          & $compiler "/DSourceExe=$source" "/O$outDir" "${{ inputs.installer }}"
          if ($LASTEXITCODE -ne 0) { throw "Overlay installer compilation failed" }
          if (-not (Get-ChildItem $outDir -Filter *.exe)) { throw "Installer not created" }
      - name: Smoke test isolated installer and verify executable hash
        shell: pwsh
        run: |
          # A real script-directory fixture verifies the combined installer,
          # including Chinese Illustrator locale folder names.
          $aiFixture = Join-Path $env:ProgramFiles "Adobe/Adobe Illustrator Bridge Test/Presets/zh_CN/�ű�"
          New-Item -ItemType Directory -Force -Path $aiFixture | Out-Null
          $installer = (Get-ChildItem overlay-output -Filter *.exe | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP "Leo-Bridge-022-Smoke"
          $process = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`"" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Installer smoke test failed" }
          $installed = Join-Path $installDir "vectorcraft.exe"
          $launchLink = Join-Path $env:LOCALAPPDATA "Leo Design/AI Bridge/LaunchVectorCraft.lnk"
          if (-not (Test-Path $launchLink)) { throw "Installer omitted isolated receiver launcher" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($launchLink)
          if ($link.Arguments -ne "--new-instance") { throw "Receiver must not forward to an official VectorCraft process" }
          $sender = Join-Path $aiFixture "Leo Design - Send to VectorCraft.jsx"
          if (-not (Test-Path $sender)) { throw "Combined installer omitted Illustrator sender" }
          if ((Get-FileHash $sender).Hash -ne (Get-FileHash "overlay-source/AI Bridge/Send_to_VectorCraft.jsx").Hash) { throw "Sender differs from tested source" }
          $registeredReceiver = (Get-Content (Join-Path $env:LOCALAPPDATA "Leo Design/AI Bridge/receiver.txt") -Raw).Trim()
          if ($registeredReceiver -ne $installed) { throw "Receiver was not configured" }
          if ((Get-FileHash $installed).Hash -ne (Get-FileHash overlay-source/vectorcraft.exe).Hash) { throw "Installed EXE differs from tested build" }
          foreach ($required in @("portable.txt", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE", "VERSION.txt")) {
            if (-not (Test-Path (Join-Path $installDir $required))) { throw "Installer omitted $required" }
          }
          $versionFile = Join-Path $installDir "installed-version.txt"
          $versionProcess = Start-Process -FilePath $installed -ArgumentList "--version" -RedirectStandardOutput $versionFile -Wait -PassThru -WindowStyle Hidden
          $version = [string](Get-Content $versionFile -Raw)
          if ($versionProcess.ExitCode -ne 0 -or $version -notmatch "Core Bridge 0.17.0") { throw "Installed EXE identity check failed" }
          Get-FileHash $installer -Algorithm SHA256 | Format-List | Out-String | Set-Content overlay-output/SHA256.txt
          Copy-Item overlay-source/BUILD_COMMIT.txt overlay-output/
          Copy-Item overlay-source/UPSTREAM_COMMIT.txt overlay-output/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.output }}
          path: overlay-output/
          if-no-files-found: error
          retention-days: 30
