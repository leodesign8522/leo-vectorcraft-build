name: Leo Design Core Bridge v0.13.2
on:
  workflow_dispatch:
  push:
    branches:
      - leo-v021-migration
    paths:
      - ".github/workflows/build-v021-core.yml"
      - ".github/workflows/build-v021-edition.yml"
      - "v021/**"
      - "scripts/**"

permissions:
  contents: read
jobs:
  edition:
    uses: ./.github/workflows/build-v021-edition.yml
    with:
      flavor: core
      label: Leo Design Core Bridge v0.13.2
      artifact: Leo_Design_Core_Bridge_v0.13.2_Windows_x64
      installer: v021/overlay/Leo_Design_Core_Bridge.iss
      output: Leo_Design_Core_Bridge_v0.13.2_Installer
