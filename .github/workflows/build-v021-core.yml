name: Leo Design Core Bridge v0.10.5 - separate optional Pie Menu

on:
  workflow_dispatch:
  push:
    branches:
      - leo-v021-migration
    paths:
      - ".github/workflows/build-v021-core.yml"
      - "v021/**"

permissions:
  contents: read

concurrency:
  group: leo-vectorcraft-v021-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-contract:
    name: Verify optional installer install/remove contract
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile installer against isolated Windows executable fixtures
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Unable to install Inno Setup" }
          }
          $fixtures = (New-Item -ItemType Directory -Force -Path "installer-fixtures").FullName
          $base = Join-Path $fixtures "base.exe"
          $pie = Join-Path $fixtures "pie.exe"
          Copy-Item $env:COMSPEC $base
          Copy-Item (Get-Command powershell.exe).Source $pie
          $outDir = (New-Item -ItemType Directory -Force -Path "installer-contract-output").FullName
          & $compiler "/DBaseExe=$base" "/DPieExe=$pie" "/O$outDir" "v021/pie-menu/Leo_Design_Pie_Menu.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer contract compile failed" }
          $installer = (Get-ChildItem $outDir -Filter *.exe | Select-Object -First 1).FullName
          & ./v021/pie-menu/test_optional_installer.ps1 -Installer $installer -BaseExe $base -PieExe $pie
          if ($LASTEXITCODE -ne 0) { throw "Installer contract regression failed" }
  build:
    needs: installer-contract
    name: Core Bridge ${{ matrix.flavor }} (VectorCraft v0.21)
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: core
            label: 默认版（不含饼菜单）
            artifact: Leo_Design_VectorCraft_v021_Core_Bridge_v0.10.5_No_Pie_Windows_x64
          - flavor: pie
            label: 饼菜单可选包编译输入（含 Core Bridge）
            artifact: Leo_Design_Pie_Menu_v0.7.4_Build_Input
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_OPT_LEVEL: "0"
      CARGO_PROFILE_TEST_CODEGEN_UNITS: "256"
    steps:
      - name: Checkout Leo Design migration source
        uses: actions/checkout@v4
      - name: Checkout official VectorCraft v0.21.0
        uses: actions/checkout@v4
        with:
          repository: storytold/vectorcraft
          ref: v0.21.0
          path: vectorcraft
          persist-credentials: false
      - name: Install Python for compatibility patches
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python patch syntax before Rust setup
        shell: pwsh
        run: |
          python -m compileall -q v021 scripts
          if ($LASTEXITCODE -ne 0) { throw "Python patch syntax validation failed" }
      - name: Install stable Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Cache v0.21 Rust release build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "vectorcraft -> target"
          # Reuse compatible v018 dependency artifacts; Cargo fingerprints
          # and the new Cargo.lock still invalidate changed crates.
          shared-key: "leo-vectorcraft-v018-core-windows-release"
          cache-all-crates: false
          cache-on-failure: true
      - name: Verify pinned official v0.21 baseline
        shell: pwsh
        working-directory: vectorcraft
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "11862f61198c8f62c0b22b6c9a331cc5950ac98d") {
            throw "Unexpected upstream source commit"
          }
          # This exact upstream SHA already passed cargo check in run 41565654553.
          # Feature-only rebuilds compile/test the enhanced source below.
      - name: Apply modular Leo Design Core Bridge
        shell: pwsh
        run: |
          python v021/patch_core_bridge.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Design Core Bridge source patch failed" }
          python v021/patch_screenshot_paste.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Screenshot Paste patch failed" }
          python v021/patch_screenshot_paste_v2.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Screenshot paste v2 compatibility patch failed" }
          python v021/patch_screenshot_paste_v3.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Native CF_BITMAP and Ctrl+V fallback patch failed" }
          python v021/patch_essential_features.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Design essential v0.21 patches failed" }
          python v021/patch_ai_import.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "AI import integration failed" }
          python v021/patch_svg_clipboard_fonts.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "SVG clipboard font alias migration failed" }
          python v021/patch_image_export.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Image Pro Export v0.21 integration failed" }
          python v021/patch_panel_usability.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo panel size and scrolling patch failed" }
          python v021/patch_ico_export.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Windows ICO export integration failed" }
          python v021/patch_docked_panel_sizes.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo docked panel size state patch failed" }
          python v021/patch_workspace_flyout_sizes.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo per-workspace flyout size save/restore failed" }
          python v021/patch_smart_interactions.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Smart Select and Group Anchor Move patch failed" }
          python v021/patch_live_corner_geometry_link.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Live Corner Geometry Link patch failed" }
          python v021/patch_direct_marquee_edges.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Direct Selection marquee edge patch failed" }
          python v021/patch_smart_guide_colors.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo multi-colour Smart Guides patch failed" }
          python v021/patch_anchor_drag_snap.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Shift anchor drag and edge-intersection patch failed" }
          python v021/patch_anchor_extension_axes.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo horizontal and vertical line extension patch failed" }
          python v021/patch_anchor_visuals.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "LC-026 page-axis snapping and extension guide visuals patch failed" }
          python v021/patch_anchor_drag_tests.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Shift-click selection test migration failed" }
          python v021/patch_quick_settings.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo Units and Colour dock panels patch failed" }
          if ("${{ matrix.flavor }}" -eq "pie") {
            python v021/patch_pie_menu.py vectorcraft
            if ($LASTEXITCODE -ne 0) { throw "Optional Pie Menu integration failed" }
          } else {
            python v021/patch_optional_pie_prefs.py vectorcraft
            if ($LASTEXITCODE -ne 0) { throw "Dormant optional preferences compatibility failed" }
          }
          python v021/patch_doc_info_selection.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Document Info selection statistics patch failed" }
          python v021/patch_action_shortcuts.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Action shortcut integration failed" }
          python scripts/patch_color_panel_lock.py vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Leo CMYK display-mode lock patch failed" }
          git -C vectorcraft diff --check
          if ($LASTEXITCODE -ne 0) { throw "Source whitespace validation failed" }
          git -C vectorcraft diff --stat
      - name: Apply pinned craft-ui docked flyout resizing
        shell: pwsh
        working-directory: vectorcraft
        run: |
          cargo fetch --locked
          if ($LASTEXITCODE -ne 0) { throw "Unable to fetch pinned craft-ui git dependency" }
          python ../v021/patch_craft_ui_flyout.py
          if ($LASTEXITCODE -ne 0) { throw "craft-ui in-place flyout resize patch failed" }
          # The Rust cache includes a precompiled craft-ui. Cargo did not
          # recompile it after editing the pinned git checkout in v0.9.7.
          # Force invalidation so the patched flyout renderer is in the EXE.
          cargo clean --release -p craft-ui
          if ($LASTEXITCODE -ne 0) { throw "Unable to invalidate cached craft-ui" }
      - name: Verify Core and optional Pie separation
        shell: pwsh
        run: |
          python v021/check_pie_separation.py vectorcraft "${{ matrix.flavor }}"
          if ($LASTEXITCODE -ne 0) { throw "Unexpected pie input or UI hooks" }
      - name: Format migrated Rust source
        shell: pwsh
        working-directory: vectorcraft
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "Rust formatting failed" }
      - name: Test dormant optional preferences in Core only
        if: matrix.flavor == 'core'
        shell: pwsh
        working-directory: vectorcraft
        run: |
          cargo test --locked -p vectorcraft-ui-egui leo_optional_prefs_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Core must retain settings without loading Pie Menu" }
      - name: Test native Leo Design Pie Menu gestures and configuration
        if: matrix.flavor == 'pie'
        shell: pwsh
        working-directory: vectorcraft
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cargo test --locked -p vectorcraft-ui-egui leo_pie_menu::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Leo Pie Menu gesture and config regressions failed" }
      - name: Test persistent action shortcuts and native Actions compatibility
        shell: pwsh
        working-directory: vectorcraft
        run: |
          cargo test --locked -p vectorcraft-ui-egui leo_action_shortcut_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Action shortcut regressions failed" }
          cargo test --locked -p vectorcraft-ui-egui panels::actions::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Native Actions regressions failed" }
      - name: Test live Document Info selection statistics
        shell: pwsh
        working-directory: vectorcraft
        run: |
          cargo test --locked -p vectorcraft-ui-egui panels::doc_info::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Document Info selection cache and panel regressions failed" }
          if ("${{ matrix.flavor }}" -eq "core") {
            cargo test --locked -p vectorcraft-engine cmd::docinfo::tests -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw "Document Info engine regressions failed" }
          }
      - name: Test screenshot candidate decoding and paste modifier order
        shell: pwsh
        working-directory: vectorcraft
        run: |
          cargo test --locked -p vectorcraft-ui-egui leo_pixpin_key_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Screenshot paste modifier regressions failed" }
          cargo test --locked -p vectorcraft-ui-egui leo_pixpin_modifier_fallback_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Release-only Ctrl+V modifier fallback regressions failed" }
          if ("${{ matrix.flavor }}" -eq "core") {
            cargo test --locked -p vectorcraft leo_pixpin_bitmap_tests -- --nocapture
            if ($LASTEXITCODE -ne 0) { throw "Windows screenshot candidate regressions failed" }
          }
      - name: Test Shift page-axis snapping and extension guide feedback
        shell: pwsh
        working-directory: vectorcraft
        run: |
          cargo test --locked -p vectorcraft-tools shift_clicking_anchor_after_segment_pick_toggles_or_adds -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Shift-click selection regression failed" }
          cargo test --locked -p vectorcraft-tools leo_shift_drag -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Shift-constrained anchor drag regressions failed" }
          cargo test --locked -p vectorcraft-tools leo_arbitrary_angle_extension -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Arbitrary-angle extension intersection regression failed" }
          cargo test --locked -p vectorcraft-tools leo_anchor_extension_intersection_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Line extension direction and intersection regressions failed" }
          cargo test --locked -p vectorcraft-tools leo_anchor_extension_visual_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Extension preview and snap visual-state regressions failed" }
      - name: Compile Windows x64 native EXE
        shell: pwsh
        working-directory: vectorcraft
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_TERM_COLOR: always
        run: |
          cargo build --release --locked -p vectorcraft
          if ($LASTEXITCODE -ne 0) { throw "Core Bridge Windows compilation failed" }
      - name: Test live corner endpoint movement, regeneration and undo
        # Shared backend source is identical in both editions; validate it once.
        if: matrix.flavor == 'core'
        shell: pwsh
        working-directory: vectorcraft
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          cargo test --locked -p vectorcraft-engine leo_open_path_corner_stays_live_after_endpoint_move_and_undo -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Live corner drag regression failed" }
          cargo test --locked -p vectorcraft-engine leo_move_anchor_endpoint_keeps_live_corner -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Live corner explicit move regression failed" }
      - name: Test editable AI import and SVG clipboard fonts
        shell: pwsh
        working-directory: vectorcraft
        run: |
          cargo test --locked -p vectorcraft-ui-egui leo_ai_import_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "AI import UI regressions failed" }
          cargo test --locked -p vectorcraft-engine cmd::fileio::tests_aiimport -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "AI native data regressions failed" }
          cargo test --locked -p vectorcraft-svg leo_svg_clipboard_fonts -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "SVG clipboard font alias regression failed" }
      - name: Test PDF CJK resolver migration
        # Shared backend source is identical in both editions; validate it once.
        if: matrix.flavor == 'core'
        shell: pwsh
        working-directory: vectorcraft
        run: |
          cargo test --locked -p vectorcraft-pdf leo_pdf -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "PDF CJK resolver regression failed" }
          cargo test --locked -p vectorcraft-pdf mixed_chinese_and_latin -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Unicode font regression failed" }
      - name: Test ICO encoder and native segment selection
        shell: pwsh
        working-directory: vectorcraft
        run: |
          cargo test --locked -p vectorcraft-engine leo_ico::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "ICO encoder regression failed" }
          cargo test --locked -p vectorcraft-tools marquee -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Native marquee regression failed" }
          cargo test --locked -p vectorcraft-ui-egui shortcuts::paste::leo_screenshot_paste_tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Screenshot paste regression failed" }
          cargo test --locked -p vectorcraft-ui-egui leo_image_export -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "JPEG/PNG export option regression failed" }
          cargo test --locked -p vectorcraft-ui-egui leo_core_bridge::workspace_io::tests -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Workspace JSON compatibility regression failed" }
      - name: Package portable v0.21 experimental build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "vectorcraft/target/release/vectorcraft.exe" "dist/vectorcraft.exe"
          New-Item -ItemType File -Path "dist/portable.txt" -Force | Out-Null
          @'
          Leo Design Core Bridge v0.10.5 / VectorCraft v0.21.0
          本包：${{ matrix.label }}

          新增：截图粘贴修复：补齐 Ctrl+V 释放事件回退；原生读取 CF_BITMAP 并在 PNG / DIB 解码失败时继续尝试备用格式。PixPin 仍需用户机器实测。
          注意：PixPin 的真实系统剪贴板仍需用户机器验证；自动测试不等同于实机验收。
          新增：A 工具 Shift 拖点固定支持水平、垂直、45°方向吸附，不受 General > Constrain Angle 旋转值影响；三种方向均可吸附真实边交点。\n          新增：原线段延长线青色虚线预览；吸附成功后改为琥珀色虚线，并显示命中点与“延长线吸附”标记。
          新增：文档信息 → 对象，常驻显示已选物体 / 已选编组，未选中为 0。
          按当前选择项计数：编组作为一个物体，同时计入编组；不展开内部成员。
          新增：动作选项中为每个动作录入快捷键，直接执行并随动作保存。
          选中具体动作 → 面板右上角菜单 → 动作选项 → 点击录入快捷键 → 确定。
          已占用快捷键会提示冲突；编辑文字、对话框和录制动作时不触发。
          默认 Core Bridge 已移除饼菜单界面、快捷键和鼠标拦截。
          保留：智能选择、锚点移动整组、彩色辅助线、文字增强、AI 导入、
          截图粘贴、JPEG/PNG/ICO 导出、停靠面板尺寸、快捷设置与配置导入导出。
          历史缺口：ICC 工作空间设置记忆、完整自由工作区仍未确认恢复。

          默认便携版：解压到空文件夹，双击 vectorcraft.exe。
          默认覆盖安装器：关闭 VectorCraft，选择原 v0.21.0 安装目录。
          设置不会被安装器删除；便携版与安装版的配置目录可能不同。

          饼菜单另有单独的可选安装器，想用时再安装。
          可选安装器需要先装同版本 Core Bridge；卸载仅恢复配套 Core。
          如果主程序后来升级，卸载不会回退新程序。
          “饼菜单可选包编译输入”是安装器打包用的完整 EXE，不是普通插件。
          官方插件接口不能接管画布输入，详见 OPTIONAL_INSTALL.md。

          默认 Core 只保留已有饼菜单的原始配置数据，供重装恢复，不运行菜单。
          其他功能的边界见 LEO_DESIGN_FEATURE_REGISTRY.md 与 BUILD_VALIDATION.txt。
          编译与自动测试通过不等于 Windows GUI 和复杂用户文件均已验收。
          '@ | Set-Content "dist/README_FIRST.txt" -Encoding utf8
          @'
          Automated validation for this preview:
          - Official v0.21.0 SHA pinned; baseline cargo check passed in run 41565654553.
          - Enhanced Windows x64 native EXE: release build passed.
          - Shared Live Corner backend: validated by the Core job in this run.
          - Edition separation checked: default Core contains no Pie Menu UI/input hooks.
          - Core edition: dormant optional JSON preferences roundtrip passed.
          - Optional Pie edition: Pie Menu gesture and config regressions passed.
          Only the matching edition tests above run for this artifact.
          - Shared PDF CID/CJK backend: validated by the Core job in this run.
          - ICO container, sizes, rendering and transparency tests passed.
          - Official marquee selection tests passed.
          - Screenshot paste shortcut and native CF_BITMAP fallback tests passed.
          - Shift horizontal/vertical/45-degree page-axis snapping, arbitrary-angle intersections, and cyan/amber extension guide-state tests passed.
          - JPEG/PNG export option tests passed.
          - Workspace JSON import validation tests passed.
          Windows GUI gestures, installer execution and real user configuration
          migration still require manual acceptance. ICC working-space persistence
          and fully free workspace layout remain historical gaps.
          '@ | Set-Content "dist/BUILD_VALIDATION.txt" -Encoding utf8
          Copy-Item LEO_DESIGN_FEATURE_REGISTRY.md dist/
          Copy-Item v021/MIGRATION_CHECKLIST.md dist/
          Copy-Item v021/pie-menu/OPTIONAL_INSTALL.md dist/
          git -C vectorcraft rev-parse HEAD | Set-Content "dist/UPSTREAM_COMMIT.txt"
          & "dist/vectorcraft.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "EXE version smoke test failed" }
      - name: Upload experimental Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  overlay-installer:
    name: Build Leo Design overlay installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Leo Design installer recipe
        uses: actions/checkout@v4
      - name: Fetch enhanced VectorCraft v0.21 EXE
        uses: actions/download-artifact@v4
        with:
          name: Leo_Design_VectorCraft_v021_Core_Bridge_v0.10.5_No_Pie_Windows_x64
          path: overlay-source
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          $compiler = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Unable to install Inno Setup" }
          }
          if (-not (Test-Path $compiler)) { throw "ISCC.exe was not found" }
      - name: Compile version-checked overlay installer
        shell: pwsh
        run: |
          $compiler = "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe"
          $source = (Resolve-Path "overlay-source/vectorcraft.exe").Path
          $outDir = (New-Item -ItemType Directory -Force -Path "overlay-output").FullName
          & $compiler "/DSourceExe=$source" "/O$outDir" "v021/overlay/Leo_Design_Core_Bridge.iss"
          if ($LASTEXITCODE -ne 0) { throw "Overlay installer compilation failed" }
          $installer = Get-ChildItem -Path $outDir -Filter "Leo_Design_Core_Bridge*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Overlay installer executable not created" }
          Write-Host "Ready: $($installer.FullName) / $($installer.Length) bytes"
      - name: Upload one-click overlay installer
        uses: actions/upload-artifact@v4
        with:
          name: Leo_Design_Core_Bridge_v0.10.5_No_Pie_Overlay_Installer_for_VectorCraft_v0.21
          path: overlay-output/*.exe
          if-no-files-found: error
          retention-days: 30


  optional-pie-installer:
    name: Build optional Pie Menu installer with Core-only restore
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Leo_Design_VectorCraft_v021_Core_Bridge_v0.10.5_No_Pie_Windows_x64
          path: core-source
      - uses: actions/download-artifact@v4
        with:
          name: Leo_Design_Pie_Menu_v0.7.4_Build_Input
          path: pie-source
      - name: Compile optional installer
        shell: pwsh
        run: |
          $compiler = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { throw "Unable to install Inno Setup" }
          }
          $base = (Resolve-Path "core-source/vectorcraft.exe").Path
          $pie = (Resolve-Path "pie-source/vectorcraft.exe").Path
          if ((Get-FileHash $base).Hash -eq (Get-FileHash $pie).Hash) { throw "Optional flavor must differ from Core" }
          $outDir = (New-Item -ItemType Directory -Force -Path "pie-installer-output").FullName
          & $compiler "/DBaseExe=$base" "/DPieExe=$pie" "/O$outDir" "v021/pie-menu/Leo_Design_Pie_Menu.iss"
          if ($LASTEXITCODE -ne 0) { throw "Optional Pie installer compilation failed" }
      - name: Test optional installation and removal on isolated runner files
        shell: pwsh
        run: |
          $installer = (Get-ChildItem pie-installer-output -Filter *.exe | Select-Object -First 1).FullName
          & ./v021/pie-menu/test_optional_installer.ps1 -Installer $installer -BaseExe (Resolve-Path core-source/vectorcraft.exe).Path -PieExe (Resolve-Path pie-source/vectorcraft.exe).Path
          if ($LASTEXITCODE -ne 0) { throw "Optional install/remove regression failed" }
      - uses: actions/upload-artifact@v4
